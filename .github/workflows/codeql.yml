# CodeQL Security Scanning for Branch Reviewer
#
# This workflow performs static security analysis on TypeScript/JavaScript code
# and GitHub Actions workflows. It runs on every push, pull request, and weekly
# to catch new vulnerabilities even when code isn't changing.
#
# Key customizations for this macOS-only React Native project:
# - Runs on macos-15 (project is macOS-only per ADR-001)
# - Analyzes JavaScript/TypeScript and GitHub Actions workflows
# - Uses security-and-quality query suite for comprehensive coverage
# - Installs Node.js dependencies for accurate analysis
# - Uploads SARIF artifacts for review and debugging

name: CodeQL Security Scanning

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Run weekly on Mondays at 00:00 UTC to catch new vulnerabilities
    - cron: '0 0 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: macos-15  # Must use macOS for this macOS-only project (ADR-001)
    timeout-minutes: 15
    concurrency:
      group: codeql-${{ github.ref }}-${{ matrix.language }}
      cancel-in-progress: true
    permissions:
      # Required for all workflows
      security-events: write
      # Required to fetch internal or private CodeQL packs
      packages: read
      # Only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Analyze GitHub Actions workflows for security issues
          - language: actions
            build-mode: none
          # Analyze TypeScript/JavaScript React Native code
          - language: javascript-typescript
            build-mode: none
        # Note: Ruby not included (not used in this project)
        # CodeQL supports: actions, c-cpp, csharp, go, java-kotlin, javascript-typescript, python, ruby, rust, swift

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js for JavaScript/TypeScript analysis
      # Required to analyze dependencies and runtime behavior
      - name: Setup Node.js
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install dependencies for accurate CodeQL analysis
      # CodeQL needs to see node_modules to understand imports
      - name: Install dependencies
        if: matrix.language == 'javascript-typescript'
        run: npm ci

      # Initialize CodeQL tools for scanning
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Use comprehensive query suite for maximum security coverage
          # Options: security-extended (default), security-and-quality (comprehensive)
          queries: security-and-quality

      # Perform CodeQL analysis and upload results
      - name: Perform CodeQL Analysis
        id: codeql-analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
          # Upload SARIF results to GitHub Security tab
          upload: true
          # Output directory for SARIF files
          output: sarif-results
          # Wait for GitHub to process results
          wait-for-processing: true

      - name: Report CodeQL failure
        if: failure() && steps.codeql-analysis.outcome == 'failure'
        run: |
          echo "::error::CodeQL analysis failed for language: ${{ matrix.language }}"
          echo "::error::Query suite: security-and-quality"
          echo "::error::Build mode: ${{ matrix.build-mode }}"
          echo "::error::Check the SARIF artifact for detailed results"

      # Upload SARIF files as artifacts for review and debugging
      # Retained for 7 days, can be downloaded from Actions tab
      - name: Upload SARIF results as artifact
        uses: actions/upload-artifact@v4
        if: success() || failure()  # Skip only on cancellation
        continue-on-error: false  # Fail workflow if upload fails
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results
          retention-days: 7
